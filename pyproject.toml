[project]
name = "plan-act-workflow"
version = "0.1.0"
description = "LangGraph-based Plan and Act workflow with LiteLLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "litellm>=1.40.0",
    "streamlit>=1.35.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "deepeval>=3.8.3",
    "langfuse>=3.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]
eval = [
    "deepeval>=2.0",
    "pytest>=8.0",
]

[project.scripts]
workflow = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
markers = [
    "eval: DeepEval evaluation tests (require LLM)",
    "unit: Fast unit tests (no LLM needed)",
]
testpaths = ["tests"]
